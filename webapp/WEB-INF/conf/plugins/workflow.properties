################################################################################
# Configuration file for workflow plugin
workflow.itemsPerPage=50
daemon.automaticActionDaemon.onstartup=1
daemon.automaticActionDaemon.interval=14400

daemon.archiveDaemon.onstartup=0
daemon.archiveDaemon.interval=86400

# Seconds after which the claim of a resource by an action is ignored (instance stopped during the action).
# Longer than the slowest synchronous action of the workflows
workflow.resourceWorkflow.lockTimeout=300
